services:
  vllm:
    image: vllm/vllm-openai:nightly-aarch64
    container_name: vllm-local-coder
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      # - Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8
      - Qwen/Qwen3-Coder-Next-FP8
      - --served-model-name
      - local-coder
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.90"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
