# dcm model-plane encoders (TEI).
#
# These two services are the *encoder half* of the always-on model plane. They
# live in their own Compose file so they can be converged without ever touching
# the vLLM service: the interactive Codex session itself is served by that vLLM
# container, so any up/down/restart that converges the LLM service is a
# self-inflicted outage. Use `dcm encoders ...` for this file.
#
# Image: TEI 1.9 "121" (sm_121 / GB10) CUDA build, arm64/sbsa, pinned by digest.
# Verified against this exact digest via `text-embeddings-router --help`:
#   * --max-input-length DOES NOT EXIST in this build; passing it makes clap
#     exit 2 so the container never starts. Bound the workload with
#     --max-batch-tokens + --auto-truncate instead.
#   * --dtype accepts only float16|float32.
#   * There is no --reranker flag: TEI infers the serving type from the model
#     architecture, so a sequence-classification model such as
#     BAAI/bge-reranker-v2-m3 is served as a reranker on POST /rerank.
# Isolate the Compose project so converging the encoders can never converge the
# LLM. Without this, this file shares project "local-claude-code" with
# docker-compose.qwen38-flash-next.yml and `compose down` here also stops
# vllm-local-coder - the container serving the interactive agent session.
name: dcm-model-plane

services:
  embedding:
    image: "${DCM_EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:121-1.9@sha256:a8f7f1b33b18a8a8d87b9f16268803ce83c9b4dd33fc05424b3b5375bf18c85c}"
    container_name: dcm-embedding-bge-m3
    ipc: host
    shm_size: 1gb
    restart: unless-stopped

    ports:
      - "127.0.0.1:${DCM_EMBEDDING_PORT:-8081}:80"

    networks:
      model-plane:
        aliases:
          - dcm-embedding

    volumes:
      - ~/.cache/huggingface:/data

    environment:
      HF_TOKEN: "${HF_TOKEN:-}"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Unlike a second generative vLLM instance, this encoder reserves no KV
    # cache, so the primary LLM keeps every existing --gpu-memory-utilization
    # value unchanged. The activation workload is bounded explicitly.
    command:
      - --model-id
      - "${DCM_EMBEDDING_MODEL:-BAAI/bge-m3}"
      - --revision
      - "${DCM_EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}"
      - --served-model-name
      - "${DCM_EMBEDDING_MODEL_ALIAS:-bge-m3}"
      - --pooling
      - cls
      - --dtype
      - float16
      - --max-batch-tokens
      - "${DCM_EMBEDDING_MAX_BATCH_TOKENS:-8192}"
      - --max-batch-requests
      - "${DCM_EMBEDDING_MAX_BATCH_REQUESTS:-8}"
      - --max-client-batch-size
      - "${DCM_EMBEDDING_MAX_CLIENT_BATCH_SIZE:-32}"
      - --max-concurrent-requests
      - "${DCM_EMBEDDING_MAX_CONCURRENT_REQUESTS:-32}"
      - --auto-truncate
      - "true"

  reranker:
    image: "${DCM_RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:121-1.9@sha256:a8f7f1b33b18a8a8d87b9f16268803ce83c9b4dd33fc05424b3b5375bf18c85c}"
    container_name: dcm-reranker-bge-v2-m3
    ipc: host
    shm_size: 1gb
    restart: unless-stopped

    ports:
      - "127.0.0.1:${DCM_RERANKER_PORT:-8082}:80"

    networks:
      model-plane:
        aliases:
          - dcm-reranker

    volumes:
      - ~/.cache/huggingface:/data

    environment:
      HF_TOKEN: "${HF_TOKEN:-}"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # BGE-reranker-v2-m3 is a cross-encoder: it scores (query, document) pairs
    # for the RAG rerank stage instead of emitting vectors. Maple Chat reranks
    # up to `rerank_limit` (30) candidates per query, so client batch size stays
    # above that while batch tokens stay bounded.
    # Sizing is measured, not guessed, and two of the obvious knobs are traps.
    #
    # 429 "Model is overloaded" is a PERMIT limit, not a token or VRAM limit.
    # With --max-concurrent-requests 16 this service refused any request with
    # more than 16 inputs at ANY length: 30 x ~600 tokens and 30 x ~100 tokens
    # both failed, while 16 x ~50 tokens succeeded. Raising permits to 64 made
    # every shape pass. Keep --max-concurrent-requests >= --max-client-batch-size
    # (dcm enforces this invariant), otherwise a legal client batch is a
    # guaranteed 429.
    #
    # --max-batch-tokens is bounded by the GPU, not by the workload: raising it to
    # 20480 made candle fail CUDA init with CUDA_ERROR_OUT_OF_MEMORY and TEI then
    # silently served the model on CPU, which also caps max_batch_requests at 4.
    # 8192 boots on CUDA on this box.
    command:
      - --model-id
      - "${DCM_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}"
      - --revision
      - "${DCM_RERANKER_MODEL_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}"
      - --served-model-name
      - "${DCM_RERANKER_MODEL_ALIAS:-bge-reranker-v2-m3}"
      - --dtype
      - float16
      - --max-batch-tokens
      - "${DCM_RERANKER_MAX_BATCH_TOKENS:-8192}"
      - --max-batch-requests
      - "${DCM_RERANKER_MAX_BATCH_REQUESTS:-8}"
      - --max-client-batch-size
      - "${DCM_RERANKER_MAX_CLIENT_BATCH_SIZE:-64}"
      - --max-concurrent-requests
      - "${DCM_RERANKER_MAX_CONCURRENT_REQUESTS:-64}"
      - --auto-truncate
      - "true"

networks:
  model-plane:
    name: dcm-model-plane
