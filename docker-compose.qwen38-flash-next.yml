services:
  vllm:
    image: qwen38-flash-dgx
    container_name: vllm-local-coder
    network_mode: host
    ipc: host
    restart: unless-stopped
    shm_size: 16gb

    volumes:
      - ~/.cache/huggingface:/hf

    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      VLLM_TARGET_DEVICE: cuda
      CUTE_DSL_ARCH: sm_121a
      VLLM_PLE_MMAP: "1"
      VLLM_PLE_MMAP_WORKERS: "32"
      VLLM_PLE_MMAP_PREWARM: "0"
      VLLM_QSA_EXACT_TOPK: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "0"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    entrypoint:
      - /bin/sh
      - -lc
    command:
      - >-
        MODEL_ROOT=/hf/hub/models--Inferact--Qwen3.8-Flash-Next-NVFP4;
        SNAPSHOT="$$(find "$$MODEL_ROOT/snapshots" -mindepth 1 -maxdepth 1 -type d ! -name '*-fp8hybrid' | head -n 1)";
        test -n "$$SNAPSHOT" || { echo "Qwen3.8-Flash-Next checkpoint not found; run: dcm setup qwen38-flash-next" >&2; exit 1; };
        exec vllm serve "$$SNAPSHOT"
        --served-model-name local-coder
        --host 0.0.0.0
        --port 8001
        --load-format safetensors
        --max-model-len 262144
        --max-num-seqs 8
        --gpu-memory-utilization 0.75
        --enable-prefix-caching
        --enable-chunked-prefill
        --max-num-batched-tokens 8192
        -cc.cudagraph_mode=PIECEWISE
        -cc.splitting_ops='["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen3_8_flash_next_ple_short_conv","vllm::qwen3_8_flash_next_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::sparse_attn_indexer","vllm::ple_mmap_lookup"]'
        --no-enable-flashinfer-autotune
        --kv-cache-dtype auto
        --enable-auto-tool-choice
        --tool-call-parser qwen3_coder
        --reasoning-parser qwen3
        --default-chat-template-kwargs '{"enable_thinking":true,"preserve_thinking":true}'
        --limit-mm-per-prompt '{"image":4,"video":1}'
        --speculative-config '{"method":"mtp","num_speculative_tokens":2}'
        ${QWEN38_FLASH_MODEL_MODE_ARGS-}
